<svg viewBox="0 0 840 920" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .wg{stroke:#16324a;stroke-width:3;fill:none;stroke-linecap:round;}
      .ring{stroke:#16324a;stroke-width:3.5;fill:none;}
      .dot{fill:#1f7a4d;}
      .tdot{fill:#b03030;}
      .gold{stroke:#d4a017;stroke-width:6;fill:none;stroke-linecap:round;}
      .card{fill:#f7f9fb;stroke:#d9e2ea;stroke-width:1.5;rx:10;}
      .lbl{font-size:13px;fill:#16324a;text-anchor:middle;}
      .num{font-size:12px;fill:#d4a017;text-anchor:middle;}
      .title{font-size:24px;font-weight:700;fill:#16324a;text-anchor:middle;}
      .sub{font-size:13px;fill:#5a6b7a;text-anchor:middle;}
      .bfull{fill:#1f7a4d;}
      .bopen{fill:#ffffff;stroke:#1f7a4d;stroke-width:1.8;}
    </style>
  </defs>

  <rect x="0" y="0" width="840" height="920" fill="#ffffff"/>
  <text x="420" y="38" class="title">TimeLightHub — The 13 Photonic Elements</text>
  <text x="420" y="58" class="sub">a composable kit: the same elements, arranged differently, become different machines</text>

  <!-- 1 Snowflake (grounded) -->
  <g transform="translate(20,75)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g>
    <g transform="translate(95,75)">
      <line class="wg" x1="-60" y1="0" x2="60" y2="0"/>
      <line class="wg" x1="-30" y1="-52" x2="30" y2="52"/>
      <line class="wg" x1="30" y1="-52" x2="-30" y2="52"/>
      <circle class="dot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">1</text><text x="95" y="166" class="lbl">Snowflake (clock hub)</text>
  </g>
  <!-- 2 Y-junction (demonstrated) -->
  <g transform="translate(215,75)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bfull"/></g>
    <g transform="translate(95,75)">
      <line class="wg" x1="0" y1="55" x2="0" y2="0"/>
      <line class="wg" x1="0" y1="0" x2="-42" y2="-48"/>
      <line class="wg" x1="0" y1="0" x2="42" y2="-48"/>
      <circle class="dot" cx="0" cy="0" r="5"/>
    </g>
    <text x="95" y="148" class="num">2</text><text x="95" y="166" class="lbl">Y-junction (split/combine)</text>
  </g>
  <!-- 3 Square-Diagonal (grounded) -->
  <g transform="translate(410,75)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g>
    <g transform="translate(95,75)">
      <rect class="wg" x="-48" y="-48" width="96" height="96"/>
      <line class="wg" x1="-48" y1="-48" x2="48" y2="48"/>
      <line class="wg" x1="48" y1="-48" x2="-48" y2="48"/>
      <circle class="dot" cx="-48" cy="-48" r="4.5"/><circle class="dot" cx="48" cy="-48" r="4.5"/>
      <circle class="dot" cx="-48" cy="48" r="4.5"/><circle class="dot" cx="48" cy="48" r="4.5"/>
      <circle class="dot" cx="0" cy="0" r="6"/>
    </g>
    <text x="95" y="148" class="num">3</text><text x="95" y="166" class="lbl">Square-Diagonal (pipeline)</text>
  </g>
  <!-- 4 X-junction (demonstrated) -->
  <g transform="translate(605,75)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bfull"/></g>
    <g transform="translate(95,75)">
      <line class="wg" x1="-58" y1="-52" x2="58" y2="52"/>
      <line class="wg" x1="58" y1="-52" x2="-58" y2="52"/>
      <circle class="tdot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">4</text><text x="95" y="166" class="lbl">X-junction (XOR, demonstrated)</text>
  </g>

  <!-- 5 Circle-2Y (grounded) -->
  <g transform="translate(20,270)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="40"/>
      <line class="wg" x1="-72" y1="0" x2="72" y2="0"/>
      <line class="wg" x1="-72" y1="0" x2="-86" y2="-10"/><line class="wg" x1="-72" y1="0" x2="-86" y2="10"/>
      <line class="wg" x1="72" y1="0" x2="86" y2="-10"/><line class="wg" x1="72" y1="0" x2="86" y2="10"/>
      <circle class="dot" cx="-40" cy="0" r="4.5"/><circle class="dot" cx="40" cy="0" r="4.5"/>
      <circle class="dot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">5</text><text x="95" y="166" class="lbl">Circle-2Y (non-volatile latch)</text>
  </g>
  <!-- 6 Circle-4Y (new design) -->
  <g transform="translate(215,270)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="40"/>
      <line class="wg" x1="-72" y1="0" x2="72" y2="0"/><line class="wg" x1="0" y1="-72" x2="0" y2="72"/>
      <line class="wg" x1="72" y1="0" x2="86" y2="-10"/><line class="wg" x1="72" y1="0" x2="86" y2="10"/>
      <line class="wg" x1="-72" y1="0" x2="-86" y2="-10"/><line class="wg" x1="-72" y1="0" x2="-86" y2="10"/>
      <line class="wg" x1="0" y1="-72" x2="-10" y2="-86"/><line class="wg" x1="0" y1="-72" x2="10" y2="-86"/>
      <line class="wg" x1="0" y1="72" x2="-10" y2="86"/><line class="wg" x1="0" y1="72" x2="10" y2="86"/>
      <circle class="dot" cx="40" cy="0" r="4.5"/><circle class="dot" cx="-40" cy="0" r="4.5"/><circle class="dot" cx="0" cy="40" r="4.5"/><circle class="dot" cx="0" cy="-40" r="4.5"/>
      <circle class="dot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">6</text><text x="95" y="166" class="lbl">Circle-4Y (any-gate ring)</text>
  </g>
  <!-- 7 Circle-2X (grounded) -->
  <g transform="translate(410,270)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="40"/>
      <line class="wg" x1="-62" y1="-56" x2="62" y2="56"/>
      <line class="wg" x1="62" y1="-56" x2="-62" y2="56"/>
      <circle class="dot" cx="29.7" cy="26.8" r="4"/><circle class="dot" cx="-29.7" cy="-26.8" r="4"/>
      <circle class="dot" cx="-29.7" cy="26.8" r="4"/><circle class="dot" cx="29.7" cy="-26.8" r="4"/>
      <circle class="tdot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">7</text><text x="95" y="166" class="lbl">Circle-2X (comparator)</text>
  </g>
  <!-- 8 Circle-4X (new design) -->
  <g transform="translate(605,270)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="40"/>
      <line class="wg" x1="-58" y1="0" x2="58" y2="0"/><line class="wg" x1="0" y1="-58" x2="0" y2="58"/>
      <line class="wg" x1="-41" y1="-41" x2="41" y2="41"/><line class="wg" x1="41" y1="-41" x2="-41" y2="41"/>
      <circle class="dot" cx="40" cy="0" r="4"/><circle class="dot" cx="-40" cy="0" r="4"/><circle class="dot" cx="0" cy="40" r="4"/><circle class="dot" cx="0" cy="-40" r="4"/>
      <circle class="dot" cx="28.3" cy="28.3" r="4"/><circle class="dot" cx="-28.3" cy="-28.3" r="4"/><circle class="dot" cx="28.3" cy="-28.3" r="4"/><circle class="dot" cx="-28.3" cy="28.3" r="4"/>
      <circle class="tdot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">8</text><text x="95" y="166" class="lbl">Circle-4X (adder/arbiter)</text>
  </g>

  <!-- 9 Delay Selector (grounded) -->
  <g transform="translate(20,465)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g>
    <g transform="translate(95,75)">
      <line class="wg" x1="-60" y1="-40" x2="-60" y2="40"/>
      <line class="wg" x1="60" y1="-40" x2="60" y2="40"/>
      <path class="wg" d="M-60,-28 Q0,-44 60,-28"/>
      <path class="wg" d="M-60,0 Q0,16 60,0"/>
      <path class="wg" d="M-60,28 Q0,58 60,28"/>
    </g>
    <text x="95" y="148" class="num">9</text><text x="95" y="166" class="lbl">Delay Selector (timing)</text>
  </g>
  <!-- 10 Triple-X systolic (new design) -->
  <g transform="translate(215,465)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="30"/>
      <line class="wg" x1="-22" y1="-22" x2="22" y2="22"/><line class="wg" x1="22" y1="-22" x2="-22" y2="22"/>
      <circle class="dot" cx="0" cy="0" r="6"/>
      <g transform="translate(-66,0)"><line class="wg" x1="-16" y1="-16" x2="16" y2="16"/><line class="wg" x1="16" y1="-16" x2="-16" y2="16"/><circle class="dot" cx="0" cy="0" r="5"/></g>
      <g transform="translate(66,0)"><line class="wg" x1="-16" y1="-16" x2="16" y2="16"/><line class="wg" x1="16" y1="-16" x2="-16" y2="16"/><circle class="dot" cx="0" cy="0" r="5"/></g>
      <line class="wg" x1="-50" y1="0" x2="-30" y2="0"/><line class="wg" x1="30" y1="0" x2="50" y2="0"/>
    </g>
    <text x="95" y="148" class="num">10</text><text x="95" y="166" class="lbl">Triple-X (systolic matmul)</text>
  </g>
  <!-- 11 Circle-Y neural (new design) -->
  <g transform="translate(410,465)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="36"/>
      <line class="wg" x1="-26" y1="-26" x2="26" y2="26"/><line class="wg" x1="26" y1="-26" x2="-26" y2="26"/>
      <line class="wg" x1="-36" y1="0" x2="-60" y2="0"/><line class="wg" x1="-60" y1="0" x2="-80" y2="-14"/><line class="wg" x1="-60" y1="0" x2="-80" y2="14"/>
      <line class="wg" x1="36" y1="0" x2="60" y2="0"/><line class="wg" x1="60" y1="0" x2="80" y2="-14"/><line class="wg" x1="60" y1="0" x2="80" y2="14"/>
      <circle class="dot" cx="-60" cy="0" r="4.5"/><circle class="dot" cx="60" cy="0" r="4.5"/>
      <circle class="dot" cx="0" cy="0" r="6"/>
    </g>
    <text x="95" y="148" class="num">11</text><text x="95" y="166" class="lbl">Circle-Y (sum + broadcast)</text>
  </g>
  <!-- 12 Active Ring (grounded) -->
  <g transform="translate(605,465)"><rect class="card" width="190" height="180"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g>
    <g transform="translate(95,75)">
      <circle class="ring" cx="0" cy="0" r="40"/>
      <path class="gold" d="M-28,-28 A40 40 0 0 1 28,-28"/>
      <line class="wg" x1="-72" y1="0" x2="-40" y2="0"/><line class="wg" x1="40" y1="0" x2="72" y2="0"/>
      <line class="gold" x1="0" y1="-72" x2="0" y2="-48"/>
      <text x="0" y="-58" font-size="10" fill="#d4a017" text-anchor="middle">pump</text>
      <circle class="dot" cx="-40" cy="0" r="4.5"/><circle class="dot" cx="40" cy="0" r="4.5"/>
      <circle class="dot" cx="0" cy="0" r="7"/>
    </g>
    <text x="95" y="148" class="num">12</text><text x="95" y="166" class="lbl">Active Ring (gain + memory)</text>
  </g>

  <!-- 13 Delta-Ring (new design) -->
  <g transform="translate(20,660)"><rect class="card" width="190" height="205"/>
    <g transform="translate(172,18)"><circle r="6" class="bopen"/></g>
    <g transform="translate(95,100) scale(0.9)">
      <circle class="ring" cx="0" cy="0" r="42"/>
      <polygon class="wg" points="0,-42 -36.4,21 36.4,21"/>
      <line class="wg" x1="0" y1="-42" x2="0" y2="-64"/><line class="wg" x1="0" y1="-64" x2="-12" y2="-78"/><line class="wg" x1="0" y1="-64" x2="12" y2="-78"/>
      <line class="wg" x1="-36.4" y1="21" x2="-54" y2="34"/><line class="wg" x1="-54" y1="34" x2="-70" y2="30"/><line class="wg" x1="-54" y1="34" x2="-64" y2="48"/>
      <line class="wg" x1="36.4" y1="21" x2="54" y2="34"/><line class="wg" x1="54" y1="34" x2="70" y2="30"/><line class="wg" x1="54" y1="34" x2="64" y2="48"/>
      <circle class="dot" cx="0" cy="-42" r="6"/><circle class="dot" cx="-36.4" cy="21" r="6"/><circle class="dot" cx="36.4" cy="21" r="6"/>
    </g>
    <text x="95" y="182" class="num">13</text><text x="95" y="200" class="lbl">Delta-Ring (vote / self-correct)</text>
  </g>

  <!-- Legend -->
  <g transform="translate(215,660)"><rect class="card" width="580" height="205"/>
    <text x="36" y="32" font-size="15" font-weight="700" fill="#16324a">Legend</text>
    <line class="wg" x1="36" y1="56" x2="76" y2="56"/><text x="88" y="60" font-size="12.5" fill="#16324a">waveguide (light path)</text>
    <circle class="dot" cx="320" cy="56" r="7"/><text x="336" y="60" font-size="12.5" fill="#16324a">non-volatile node (memory)</text>
    <circle class="tdot" cx="36" cy="86" r="7"/><text x="52" y="90" font-size="12.5" fill="#16324a">threshold node (decision)</text>
    <line class="gold" x1="300" y1="86" x2="340" y2="86"/><text x="352" y="90" font-size="12.5" fill="#16324a">active / gain region (pumped)</text>
    <text x="36" y="118" font-size="13" font-weight="700" fill="#16324a">Maturity — marked honestly on every element:</text>
    <circle class="bfull" cx="42" cy="140" r="6"/><text x="54" y="144" font-size="12" fill="#16324a">demonstrated in a laboratory</text>
    <g transform="translate(232,140)"><circle r="6" class="bopen"/><path d="M0,-6 A6,6 0 0 1 0,6 Z" class="bfull"/></g><text x="244" y="144" font-size="12" fill="#16324a">demonstrated physics, our arrangement</text>
    <circle class="bopen" cx="42" cy="163" r="6"/><text x="54" y="167" font-size="12" fill="#16324a">our new design — first light will validate it</text>
    <text x="290" y="192" font-size="12" font-style="italic" fill="#5a6b7a" text-anchor="middle">Same kit → CPU pipeline, AI matrix engine, or search engine.</text>
  </g>
</svg>
